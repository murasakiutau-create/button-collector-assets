<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家具色替え工房 | Furniture Color Workshop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2a2a2a;
      color: #eee;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      overflow: hidden;
    }
    #unity-container {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }
    #loading-overlay h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }
    #loading-overlay p {
      font-size: 0.9rem;
      color: #aaa;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #555;
      border-top-color: #c8a96e;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <h1>読み込み中...</h1>
    <p>Loading Furniture Color Workshop</p>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
    };
    var canvas = document.querySelector("#unity-canvas");
    var loadingOverlay = document.querySelector("#loading-overlay");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function(progress) {
        // Optional: update progress bar here
      }).then(function (unityInstance) {
        loadingOverlay.style.opacity = "0";
        setTimeout(function() { loadingOverlay.style.display = "none"; }, 500);
      }).catch(function (message) {
        alert("起動に失敗しました / Failed to launch:\n" + message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
